<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-container">
    <h2 class="login-title">Login</h2>

    <form id="loginForm" class="login-form">
      <input type="email" id="email" class="login-input" placeholder="Email" required />
      <input type="password" id="password" class="login-input" placeholder="Password" required />

      <button type="submit" class="login-button">Masuk</button>
    </form>

    <p id="login-message" class="login-message"></p>
  </div>

<script src="/port.js"></script>
  <script>
      const form = document.getElementById("loginForm");
      const message = document.getElementById("login-message");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          const response = await fetch(CONFIG.API_BASE+"/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            credentials: "include", // penting untuk cookie refreshToken
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();

          if (!response.ok) {
            message.style.color = "red";
            message.innerText = data.msg;
          } else {
            message.style.color = "green";
            message.innerText = "Login berhasil";

            // simpan access token ke localStorage
            localStorage.setItem("accessToken", data.accessToken);
            localStorage.setItem("role", data.role);

            // redirect (opsional)
            setTimeout(() => {
              if (data.role === "admin") {
                window.location.href = "/dashboard/admin.html";
              } else {
                window.location.href = "/dashboard/user.html";
              }
            }, 1000);
          }
        } catch (error) {
          message.style.color = "red";
          message.innerText = "Terjadi kesalahan server";
          console.error(error);
        }
      });
  </script>
</body>
</html>
